# HTTP: keep ACME challenge reachable, redirect all other traffic to HTTPS
server
{
    listen 80;
    listen [::]:80;
    server_name 123.207.213.21 novelmaster.art www.novelmaster.art;

    root /www/wwwroot/arboris-novel/frontend/dist;
    index index.html index.htm default.htm default.html;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/123.207.213.21.conf;
    #CERT-APPLY-CHECK--END

    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: serve frontend + reverse proxy /api to FastAPI
server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 123.207.213.21 novelmaster.art www.novelmaster.art;

    index index.html index.htm default.htm default.html;
    root /www/wwwroot/arboris-novel/frontend/dist;

    client_max_body_size 50m;
    client_header_buffer_size 64k;
    large_client_header_buffers 4 64k;

    include /www/server/panel/vhost/nginx/extension/123.207.213.21/*.conf;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/123.207.213.21.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    #error_page 404/404.html;
    ssl_certificate /www/server/panel/vhost/cert/123.207.213.21/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/123.207.213.21/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5:!aNULL;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/html_123.207.213.21.conf;
    #REWRITE-END

    # API reverse proxy (FastAPI on 127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Vue SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block sensitive files
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # Block sensitive directories
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/
    {
        return 404;
    }

    # Allow ACME
    location ~ \.well-known
    {
        allow all;
    }

    # Disallow dangerous files under ACME path
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # Static cache
    location ~* \.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~* \.(js|css)$
    {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log /www/wwwlogs/123.207.213.21.log;
    error_log /www/wwwlogs/123.207.213.21.error.log;
}
